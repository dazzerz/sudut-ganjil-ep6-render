<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lightspark Capabilities 20s</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #020202;
      color: #f8f8f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #000000;
    }
    /* Technical Grid Lines */
    .grid-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
      opacity: 0.07;
      background-size: 72px 72px;
      background-image: 
        linear-gradient(to right, #ffffff 1px, transparent 1px),
        linear-gradient(to bottom, #ffffff 1px, transparent 1px);
    }
    /* Safe Area: 1080 x 1920 (Top: 140px, Bottom: 220px, Left/Right: 70px) */
    .safe-frame {
      position: absolute;
      top: 140px;
      left: 70px;
      width: 940px;
      height: 1560px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    /* Header Bar */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 64px;
      border-bottom: 2px solid #1c1c24;
      padding-bottom: 12px;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-origin {
      width: 32px;
      height: 32px;
      fill: #1827fa;
      flex-shrink: 0;
    }
    .header-wordmark {
      height: 22px;
      fill: #f8f8f7;
    }
    .header-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      background: #0c0d14;
      border: 1px solid #282838;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9898a8;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    /* Central Content Chassis: Unified High-Density Modular Stage */
    #content-slot {
      position: relative;
      width: 940px;
      height: 1390px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 32px;
    }

    /* Footer Bar */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 56px;
      border-top: 2px solid #1c1c24;
      padding-top: 12px;
      font-size: 15px;
      font-weight: 700;
      color: #727284;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .footer-capsule {
      background: #1827fa;
      color: #ffffff;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.06em;
      margin-right: 10px;
    }
    .footer-beat-clock {
      font-family: monospace;
      font-size: 16px;
      color: #9999aa;
    }
  </style>
</head>
<body>

      <div class="header-bar">

          </svg>
        </div>
        <div class="header-pill">
          <span class="status-dot"></span>
          <span id="badge-label">ENTERPRISE GRID</span>
        </div>
      </div>

      <!-- Main Central Dynamic Slot -->
      <div id="content-slot"></div>

      <!-- Fixed Footer -->
      <div class="footer-bar">
        <div>
          <span class="footer-capsule">LIGHTNING / UMA</span>
          <span style="color:#d8d8e2;">GLOBAL PAYMENTS OPERATING SYSTEM</span>
        </div>
        <div class="footer-beat-clock" id="beat-label">
          B:01/40 • 120 BPM
        </div>
      </div>
    </div>
  </div>

  <script>
    function easeExp(p, k = 7.5) {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      return (1 - Math.exp(-k * p)) / (1 - Math.exp(-k));
    }

    function calcVelocityBlur(p, maxPx = 16) {
      if (p <= 0 || p >= 0.75) return 0;
      const speed = (7.5 * Math.exp(-7.5 * p));
      return Math.min(maxPx, speed * 2.2);
    }

    const slot = document.getElementById('content-slot');
    const badgeLabel = document.getElementById('badge-label');
    const beatLabel = document.getElementById('beat-label');

    window.seek = function(t) {
      t = Math.max(0, Math.min(20.0, t));
      const bpm = 120;
      const beatInterval = 0.5; // seconds
      const beat = Math.min(39, Math.floor(t / beatInterval));
      const p = (t % beatInterval) / beatInterval;
      const bar = Math.floor(beat / 4);

      const ease = easeExp(p);
      const blurY = calcVelocityBlur(p, 16);

      beatLabel.textContent = `B:${String(beat + 1).padStart(2, '0')}/40 • 120 BPM`;

      let inner = '';

      switch (bar) {
        // ==========================================
        // BAR 1 (Beats 0-3, 0.0s - 2.0s): THE HOOK
        // ==========================================
        case 0:
          if (beat === 0) {
            badgeLabel.textContent = "LEGACY BOTTLENECK";
            const y = (1 - ease) * 60;
            inner = `
              <div style="transform: translateY(${y}px); filter: blur(0px ${blurY}px);">
                <div style="display:inline-block; padding:10px 22px; background:#220c0c; border:2px solid #771818; border-radius:10px; color:#ff4d4d; font-size:22px; font-weight:900; letter-spacing:0.06em; margin-bottom:20px;">
                  ⚠️ THE REALITY OF LEGACY MONEY
                </div>
                <div style="font-size:116px; font-weight:900; line-height:0.95; letter-spacing:-0.04em; color:#ffffff;">
                  MONEY IS<br><span style="color:#ff3b30;">STILL STUCK.</span>
                </div>
              </div>
              <div style="padding:48px 44px; background:#0c0d16; border:2px solid #242534; border-radius:28px;">
                <div style="font-size:30px; font-weight:800; color:#ff4d4d; margin-bottom:14px;">THE DIGITAL PARADOX</div>
                <div style="font-size:32px; font-weight:500; color:#8e8ea2; line-height:1.45;">
                  Data travels around the planet in 80 milliseconds.<br>Why do global payments still take days and sleep on weekends?
                </div>
              </div>
            `;
          } else if (beat === 1) {
            badgeLabel.textContent = "SETTLEMENT DELAY";
            const strikeWidth = Math.min(100, ease * 105);
            inner = `
              <div>
                <div style="font-size:28px; font-weight:800; color:#88889a; letter-spacing:0.06em; margin-bottom:12px;">
                  TRADITIONAL CLEARING RAILS:
                </div>
                <div style="position:relative; display:inline-block; font-size:124px; font-weight:900; line-height:0.95; letter-spacing:-0.04em; color:#ffffff;">
                  3 TO 5 DAYS.
                  <div style="position:absolute; left:-3%; top:50%; width:${strikeWidth}%; height:16px; background:#ef4444; transform:rotate(-3deg); border-radius:8px;"></div>
                </div>
              </div>
              <div style="padding:48px 44px; background:#161010; border-left:10px solid #ef4444; border-radius:20px;">
                <div style="font-size:34px; font-weight:800; color:#ffffff; margin-bottom:12px;">CORRESPONDENT BANKING CHAOS</div>
                <div style="font-size:28px; font-weight:500; color:#c08888; line-height:1.4;">
                  Batch processing windows. 5 PM cut-offs. Unpredictable intermediary fees. High failure rates.
                </div>
              </div>
            `;
          } else if (beat === 2) {
            badgeLabel.textContent = "THE PARADIGM SHIFT";
            const scale = 0.94 + ease * 0.06;
            inner = `
              <div style="transform: scale(${scale}); filter: blur(0px ${blurY * 0.7}px);">
                <div style="background:#ffffff; color:#000000; padding:52px 40px; border-radius:28px; text-align:center;">
                  <div style="font-size:26px; font-weight:900; letter-spacing:0.12em; color:#1827fa; margin-bottom:10px;">
                    THE NEW REALITY
                  </div>
                  <div style="font-size:120px; font-weight:900; line-height:0.92; letter-spacing:-0.05em;">
                    NOT ANYMORE.
                  </div>
                </div>
              </div>
              <div style="padding:48px 44px; background:#0c0d16; border:2px solid #28283a; border-radius:28px; text-align:center;">
                <div style="font-size:34px; font-weight:800; color:#ffffff; margin-bottom:12px;">STREAMING GLOBAL VALUE</div>
                <div style="font-size:28px; font-weight:500; color:#9090aa;">Real-time settlement for the modern global economy.</div>
              </div>
            `;
          } else { // beat === 3
            badgeLabel.textContent = "ENTER LIGHTSPARK";
            const y = (1 - ease) * 50;
            inner = `
              <div style="transform: translateY(${y}px); filter: blur(0px ${blurY}px);">
                <div style="font-size:28px; font-weight:800; color:#88889a; letter-spacing:0.06em; margin-bottom:12px;">
                  ENTER THE MONEY GRID
                </div>
                <div style="font-size:112px; font-weight:900; line-height:0.96; letter-spacing:-0.04em; color:#ffffff;">
                  THE API<br><span style="color:#1827fa;">FOR MONEY.</span>
                </div>
              </div>
              <div style="padding:48px 44px; background:#0a122e; border:3px solid #1827fa; border-radius:28px;">
                <div style="font-size:32px; font-weight:900; color:#ffffff; margin-bottom:12px;">ENTERPRISE LIGHTNING PLATFORM</div>
                <div style="font-size:28px; font-weight:600; color:#8ea4db; line-height:1.4;">
                  Connect traditional financial institutions with Bitcoin's layer-2 settlement network.
                </div>
              </div>
            `;
          }
          break;

        // ==========================================
        // BAR 2 (Beats 4-7, 2.0s - 4.0s): ONE API & GLOBAL RAILS
        // ==========================================
        case 1:
          badgeLabel.textContent = "GLOBAL CONNECTIVITY";
          if (beat === 4) {
            const y = (1 - ease) * 50;
            inner = `
              <div style="transform: translateY(${y}px);">
                <div style="font-size:24px; font-weight:900; letter-spacing:0.1em; color:#1827fa; margin-bottom:12px;">
                  CAPABILITY 01 • INFRASTRUCTURE
                </div>
                <div style="font-size:104px; font-weight:900; line-height:0.98; letter-spacing:-0.04em;">
                  ONE API.<br>GLOBAL MONEY.

              </div>
              <div style="padding:48px 44px; background:#0c0d16; border:2px solid #242534; border-radius:28px;">
                <div style="font-size:32px; font-weight:800; color:#ffffff; margin-bottom:16px;">UNIFIED FINANCIAL SYSTEM</div>
                <div style="font-size:28px; font-weight:500; color:#88889c; line-height:1.5;">
                  Launch global accounts, instant payments, cards, and stablecoins under your own brand with one single integration.
                </div>

            `;
          } else if (beat === 5) {
            const count = Math.min(65, Math.floor(ease * 65));
            inner = `

            `;
          } else if (beat === 6) {
            inner = `
              <div>
                <div style="font-size:24px; font-weight:900; letter-spacing:0.08em; color:#1827fa; margin-bottom:10px;">

                <div style="font-size:82px; font-weight:900; line-height:1.0; letter-spacing:-0.03em;">
                  DOMESTIC RAILS.
                </div>
              </div>
              <div style="display:flex; flex-direction:column; gap:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; padding:22px 28px; background:#141522; border:2px solid #1827fa; border-radius:18px;">
                  <span style="font-size:28px; font-weight:900; color:#ffffff;">US • FEDNOW / RTP / ACH</span>
                  <span style="font-size:20px; font-weight:800; color:#1827fa; background:#091038; padding:6px 14px; border-radius:8px;">INSTANT</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; padding:22px 28px; background:#141522; border:1px solid #28283c; border-radius:18px;">
                  <span style="font-size:28px; font-weight:900; color:#ffffff;">EUROPE • SEPA INSTANT</span>
                  <span style="font-size:20px; font-weight:800; color:#8888aa; background:#1c1c28; padding:6px 14px; border-radius:8px;">INSTANT</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; padding:22px 28px; background:#141522; border:1px solid #28283c; border-radius:18px;">
                  <span style="font-size:28px; font-weight:900; color:#ffffff;">BRAZIL • PIX</span>
                  <span style="font-size:20px; font-weight:800; color:#8888aa; background:#1c1c28; padding:6px 14px; border-radius:8px;">INSTANT</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; padding:22px 28px; background:#141522; border:1px solid #28283c; border-radius:18px;">
                  <span style="font-size:28px; font-weight:900; color:#ffffff;">MEXICO • SPEI</span>
                  <span style="font-size:20px; font-weight:800; color:#8888aa; background:#1c1c28; padding:6px 14px; border-radius:8px;">INSTANT</span>
                </div>
              </div>
            `;
          } else { // beat === 7
            inner = `
              <div>
                <div style="font-size:24px; font-weight:900; letter-spacing:0.08em; color:#1827fa; margin-bottom:10px;">
                  PRODUCT ARCHITECTURE
                </div>
                <div style="font-size:86px; font-weight:900; line-height:1.0; letter-spacing:-0.03em;">
                  LIGHTSPARK EXTEND.
                </div>
              </div>
              <div style="padding:48px 40px; background:#0c1328; border:3px solid #1827fa; border-radius:28px;">
                <div style="display:flex; align-items:center; gap:14px; margin-bottom:18px;">
                  <span style="width:14px; height:14px; border-radius:50%; background:#10b981;"></span>
                  <span style="font-size:22px; font-weight:900; color:#10b981; letter-spacing:0.08em;">DIRECT BANK DEPOSIT</span>
                </div>
                <div style="font-size:56px; font-weight:900; line-height:1.1; color:#ffffff;">
                  FUNDS LAND IN EXISTING BANK ACCOUNTS.
                </div>
                <div style="font-size:26px; font-weight:600; color:#9cb1dd; margin-top:24px;">
                  Compatible with the vast majority of U.S. and global real-time deposit accounts.
                </div>
              </div>
            `;
          }
          break;

        // ==========================================

        case 2:
          badgeLabel.textContent = "SETTLEMENT VELOCITY";

            const y = (1 - ease) * 50;
            inner = `
              <div style="transform: translateY(${y}px);">
                <div style="font-size:24px; font-weight:900; letter-spacing:0.1em; color:#1827fa; margin-bottom:12px;">

                </div>
                <div style="font-size:104px; font-weight:900; line-height:0.98; letter-spacing:-0.04em;">
                  REAL-TIME<br>SETTLEMENT.
                </div>
              </div>
              <div style="padding:48px 44px; background:#081810; border:2px solid #10b981; border-radius:28px;">
                <div style="font-size:30px; font-weight:800; color:#10b981; margin-bottom:12px;">LIGHTNING NETWORK VELOCITY</div>
                <div style="font-size:26px; font-weight:500; color:#c0dec9; line-height:1.45;">
                  Transactions settle irrevocably at the speed of light with zero counterparty credit risk.
                </div>
              </div>
            `;
          } else if (beat === 9) {
            const ms = Math.floor(412 + (1 - ease) * 350);
            inner = `
              <div>
                <div style="font-size:24px; font-weight:900; letter-spacing:0.1em; color:#10b981; margin-bottom:8px;">
                  CONFIRMATION LATENCY
                </div>
                <div style="font-size:160px; font-weight:900; line-height:0.88; letter-spacing:-0.05em; color:#10b981; font-family:monospace;">
                  ${ms}ms
                </div>
                <div style="font-size:56px; font-weight:900; color:#ffffff; margin-top:8px;">
                  SUB-SECOND CLEARING.
                </div>
              </div>
              <div style="padding:44px; background:#12131c; border:1px solid #28283c; border-radius:24px;">
                <div style="font-size:28px; font-weight:700; color:#ffffff; margin-bottom:8px;">INSTANT CASH RECONCILIATION</div>
                <div style="font-size:24px; color:#88889a;">Funds are credited, validated, and spendable in milliseconds worldwide.</div>
              </div>
            `;
          } else if (beat === 10) {
            inner = `
              <div>
                <div style="font-size:24px; font-weight:900; letter-spacing:0.1em; color:#1827fa; margin-bottom:8px;">
